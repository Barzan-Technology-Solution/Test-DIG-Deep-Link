<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doha Insurance Group - Medical Card</title>
    <style>
        :root {
            --primary: #2F3640;
            --gold: #C69214;
            --bg: #1A1F26;
            --card-bg: #242B35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(198, 146, 20, 0.25);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            height: 48px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #94A3B8;
            margin-bottom: 24px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(198, 146, 20, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: var(--gold);
            color: #000000;
            font-weight: 700;
            font-size: 15px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: opacity 0.2s;
            margin-top: 12px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .store-badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .store-badge img {
            height: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="spinner" id="spinner"></div>

        <h1 class="title">Doha Insurance Group</h1>
        <p class="subtitle" id="status-text">Redirecting to your Medical Card in DIG App...</p>

        <div id="manual-actions" style="display: none;">
            <a id="open-app-btn" href="#" class="btn">Open in DIG App</a>
            <div class="store-badges">
                <a id="play-store-link" class="store-badge"
                    href="https://play.google.com/store/apps/details?id=com.dig.android" target="_blank">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                        alt="Get it on Google Play">
                </a>
                <a id="app-store-link" class="store-badge"
                    href="https://apps.apple.com/app/com.dig.app/1394501570" target="_blank">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg"
                        alt="Download on the App Store">
                </a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // 1. Extract query params (e.g. ?cid=28140001175)
            const urlParams = new URLSearchParams(window.location.search);
            const cid = urlParams.get('cid') || '';

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            const playStoreUrl = "https://play.google.com/store/apps/details?id=com.dig.android";
            const appStoreUrl = "https://apps.apple.com/app/com.dig.app/1394501570"; // Replace with your iOS App ID

            const manualActions = document.getElementById('manual-actions');
            const statusText = document.getElementById('status-text');
            const openAppBtn = document.getElementById('open-app-btn');

            if (isAndroid) {
                // --- ANDROID SMART REDIRECT ---
                // Native Chrome Intent: opens the app if installed, automatically falls back to Play Store if not.
                const encodedFallback = encodeURIComponent(playStoreUrl);
                const androidIntentUri = `intent://medical-card?cid=${cid}#Intent;scheme=dig;package=com.dig.android;S.browser_fallback_url=${encodedFallback};end`;

                openAppBtn.href = androidIntentUri;

                // Trigger auto-redirect
                window.location.href = androidIntentUri;

                // Show manual button after 2.5 seconds if user stays on the page
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    statusText.textContent = "Didn't open automatically?";
                    manualActions.style.display = 'block';
                }, 2500);

            } else if (isIOS) {
                // --- IOS SMART REDIRECT ---
                const iosCustomScheme = `dig://medical-card?cid=${cid}`;
                openAppBtn.href = iosCustomScheme;

                const startTime = Date.now();
                window.location.href = iosCustomScheme;

                // If the app is not installed, fallback to App Store after 1.5 seconds
                setTimeout(() => {
                    if (Date.now() - startTime < 2000) {
                        window.location.href = appStoreUrl;
                    }
                }, 1500);

            } else {
                // --- DESKTOP BROWSER ---
                document.getElementById('spinner').style.display = 'none';
                statusText.textContent = cid ? `Medical Card CID: ${cid}` : "Download the DIG App on your mobile device";
                manualActions.style.display = 'block';
                openAppBtn.style.display = 'none';
            }
        })();
    </script>
</body>

</html>
